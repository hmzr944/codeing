# Publie l'application sur GitHub Pages.
#
# Réglage à faire UNE FOIS dans le dépôt, avant le premier passage :
#   Settings > Pages > Source : GitHub Actions
#
# Ce n'est pas automatisable : le jeton d'un workflow n'a pas le droit
# de créer le site Pages (l'API répond « Resource not accessible by
# integration »). Une fois la source réglée, tout est automatique.
name: Publier sur GitHub Pages

on:
  push:
    branches: [claude/plateforme-revision-code-2026-5hl406, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans interrompre celle en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la banque de questions
        run: |
          node tools/check.mjs
          node tools/lisibilite.mjs
          node tools/test-worker.mjs

      - name: Rassembler le site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js assets _site/
          # page d'erreur : renvoie vers l'application
          cp index.html _site/404.html
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
