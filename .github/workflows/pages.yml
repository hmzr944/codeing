# Vérifie le contenu, puis publie l'application sur GitHub Pages.
#
# Réglage à faire UNE FOIS dans le dépôt, avant le premier passage :
#   Settings > Pages > Source : GitHub Actions
#
# Ce n'est pas automatisable : le jeton d'un workflow n'a pas le droit
# de créer le site Pages (l'API répond « Resource not accessible by
# integration »). Une fois la source réglée, tout est automatique.
name: Publier sur GitHub Pages

on:
  push:
    branches: [claude/plateforme-revision-code-2026-5hl406, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans interrompre celle en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Les contrôles tournent sur toutes les branches : c'est là qu'on
  # veut savoir qu'une leçon ou une question est cassée.
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cohérence du contenu et lisibilité
        run: |
          node tools/check.mjs
          node tools/lisibilite.mjs
          node tools/test-worker.mjs

  # Contrôles qui exigent un vrai navigateur. Ils sont ici et pas dans
  # une revue à l'œil parce qu'ils attrapent ce qui ne se voit pas :
  # un contraste qui passe sous le seuil, un texte qui déborde à 320 px.
  # Un audit de contraste avait relevé 65 textes illisibles que la
  # lecture du CSS n'avait pas montrés.
  apparence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Servir le site
        run: |
          python3 -m http.server 8099 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8099/index.html && break
            sleep 1
          done
      - name: Contraste (WCAG AA) et tenue de 320 à 430 px
        run: |
          node tools/contraste.mjs
          node tools/responsive.mjs
      - name: L’assistant et son repli hors ligne
        run: |
          node tools/test-ia.mjs
          node tools/verifier.mjs

  # La publication, elle, n'a lieu que depuis la branche par défaut :
  # l'environnement github-pages n'autorise qu'elle, et une tentative
  # depuis une autre branche échoue en deux secondes.
  # Ce qui bloque la publication et ce qui ne la bloque pas.
  #
  # « verifier » est un verrou : il tient en six secondes, il ne
  # dépend d'aucun navigateur, et ce qu'il attrape (une leçon cassée,
  # une question sans bonne réponse, le relais de l'assistant en
  # panne) rendrait l'application fausse. On ne publie pas ça.
  #
  # « apparence » est un rapport. Il tourne quand même, il reste
  # rouge quand quelque chose cloche, et je vais le lire. Mais un
  # contraste à 4,28:1 au lieu de 4,5 sur une ligne de l'assistant
  # n'est pas une raison de priver quelqu'un de trois semaines de
  # corrections. C'est ce qui se passait : chaque écart d'apparence
  # gelait la publication, et l'application installée sur le
  # téléphone restait figée sur une vieille version sans que rien ne
  # le dise.
  publier:
    needs: [verifier, apparence]
    if: always() && github.ref == 'refs/heads/main' && needs.verifier.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rassembler le site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js assets _site/
          # page d'erreur : renvoie vers l'application
          cp index.html _site/404.html
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
